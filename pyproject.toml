[project]
name = "canopener"
version = "0.1.0"
description = "CANopen multitool for SocketCAN: live sniffer/decoder and AMC FlexPro PVT motion CLI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "canopen>=2.4.1",
    "click>=8.3.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
foxglove = ["foxglove-sdk>=0.23.1"]

[project.scripts]
canopener = "canopener.cli:cli"

[tool.uv]
package = true
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0",
    "ruff>=0.15.8",
]

[tool.hatch.build.targets.wheel]
packages = ["canopener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Block ROS pytest plugins that leak in via /opt/ros entry points.
addopts = "-p no:launch_testing -p no:launch_ros"
